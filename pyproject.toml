[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "biome-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for running Biome with token-efficient output"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [ { name = "Yago Riveiro", email = "yago.riveiro@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastmcp>=3.4.6,<4",
  "httpx>=0.28",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.14.2",
  "rich>=15.0.0",
  "typer>=0.27.1",
]
optional-dependencies.dev = [ "pytest", "ruff", "ty" ]
urls."Bug Tracker" = "https://github.com/yriveiro/biome-mcp/issues"
urls.Homepage = "https://github.com/yriveiro/biome-mcp"
scripts.biome-mcp = "biome_mcp.cli:run"
scripts.biome_mcp = "biome_mcp.cli:run"

[dependency-groups]
dev = [
  "pyproject-fmt>=2.27",
  "pytest",
  "ruff",
  "ty",
]

[tool.hatch]
build.sources.src = "src"
build.targets.wheel.packages = [ "src/biome_mcp" ]

[tool.ruff]
target-version = "py314"
line-length = 88
format.quote-style = "double"
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.python_files = "test_*.py"
